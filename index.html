<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyTube - Infinite</title>
    <style>
        :root { --yt-black: #0f0f0f; --yt-red: #ff0000; --yt-text: #fff; --sidebar-w: 240px; }
        body { background: var(--yt-black); color: var(--yt-text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { display: flex; align-items: center; padding: 10px 20px; background: var(--yt-black); border-bottom: 1px solid #222; height: 56px; flex-shrink: 0; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: var(--sidebar-w); background: #0f0f0f; border-right: 1px solid #222; padding: 15px; overflow-y: auto; flex-shrink: 0; }
        .nav-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
        .nav-item:hover { background: #272727; }
        .sub-item { font-size: 14px; padding: 8px; cursor: pointer; color: #aaa; }
        .sub-item:hover { color: white; }

        /* Content Area */
        #main-view { flex: 1; overflow-y: auto; padding: 20px; position: relative; }
        #content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .video-card { cursor: pointer; margin-bottom: 10px; }
        .thumb { width: 100%; border-radius: 12px; aspect-ratio: 16/9; background: #222; object-fit: cover; }
        .v-title { font-weight: bold; font-size: 14px; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Loading Indicator */
        #scroll-loader { text-align: center; padding: 40px; color: #aaa; font-size: 14px; grid-column: 1 / -1; }

        /* Player Overlay */
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overflow-y: auto; }
        .player-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        #video-frame { width: 100%; aspect-ratio: 16/9; border-radius: 12px; border: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 20px; cursor: pointer;" onclick="location.reload()">▶ ProxyTube</div>
    <div style="flex:1; display:flex; justify-content:center;">
        <input type="text" id="search-input" placeholder="Search">
    </div>
</header>

<div class="main-layout">
    <div id="sidebar">
        <div class="nav-item" onclick="loadTrending()">🔥 Trending</div>
        <hr style="border:0; border-top:1px solid #222; margin: 15px 0;">
        <h4 style="margin:0 0 10px 10px; color:#666; font-size:12px;">SUBSCRIPTIONS</h4>
        <div id="sub-list"></div>
    </div>

    <div id="main-view">
        <div id="content-grid"></div>
        <div id="scroll-loader">Scroll to load more...</div>
    </div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <button style="background:none; border:none; color:white; cursor:pointer; font-size:18px; margin-bottom:10px;" onclick="closeVideo()">✕ Back</button>
        <iframe id="video-frame" allowfullscreen></iframe>
        <h1 id="player-title" style="font-size: 20px; margin: 15px 0;"></h1>
    </div>
</div>

<script>
    const instances = ["https://inv.nadeko.net", "https://invidious.nerdvpn.de", "https://iv.melmac.space"];
    let currentInstance = instances[0];
    
    // Pagination state
    let currentPage = 1;
    let currentQuery = "";
    let isLoading = false;
    let currentMode = "trending"; // trending, search, or channel

    async function api(path) {
        for (let url of instances) {
            try {
                const res = await fetch(`${url}/api/v1/${path}`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) { currentInstance = url; return await res.json(); }
            } catch (e) {}
        }
        return null;
    }

    async function loadTrending(reset = true) {
        if (reset) {
            currentPage = 1;
            document.getElementById('content-grid').innerHTML = "";
            currentMode = "trending";
        }
        isLoading = true;
        document.getElementById('scroll-loader').innerText = "Loading Trending Page " + currentPage + "...";
        
        const data = await api(`trending?page=${currentPage}`);
        renderVideos(data);
        isLoading = false;
        document.getElementById('scroll-loader').innerText = "Scroll for more";
    }

    async function search(query, reset = true) {
        if (reset) {
            currentPage = 1;
            currentQuery = query;
            currentMode = "search";
            document.getElementById('content-grid').innerHTML = "";
        }
        isLoading = true;
        document.getElementById('scroll-loader').innerText = "Searching...";
        
        const data = await api(`search?q=${encodeURIComponent(query)}&page=${currentPage}`);
        renderVideos(data);
        isLoading = false;
        document.getElementById('scroll-loader').innerText = "Scroll for more";
    }

    function renderVideos(videos) {
        const grid = document.getElementById('content-grid');
        if (!videos || videos.length === 0) {
            document.getElementById('scroll-loader').innerText = "No more videos found.";
            return;
        }
        videos.forEach(v => {
            if (!v.videoId) return;
            const card = document.createElement('div');
            card.className = "video-card";
            card.onclick = () => playVideo(v.videoId, v.title);
            card.innerHTML = `
                <img class="thumb" src="${v.videoThumbnails ? v.videoThumbnails[0].url : ''}">
                <div class="v-title">${v.title}</div>
                <div style="color:#aaa; font-size:12px; margin-top:4px;">${v.author}</div>
            `;
            grid.appendChild(card);
        });
    }

    // Infinite Scroll Logic
    document.getElementById('main-view').addEventListener('scroll', (e) => {
        const { scrollTop, scrollHeight, clientHeight } = e.target;
        
        // If we are within 200px of the bottom and not already loading
        if (scrollTop + clientHeight >= scrollHeight - 200 && !isLoading) {
            currentPage++;
            if (currentMode === "trending") loadTrending(false);
            if (currentMode === "search") search(currentQuery, false);
        }
    });

    function playVideo(id, title) {
        document.getElementById('player-overlay').style.display = 'block';
        document.getElementById('video-frame').src = `${currentInstance}/embed/${id}?autoplay=1&local=true`;
        document.getElementById('player-title').innerText = title;
    }

    function closeVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video-frame').src = '';
    }

    document.getElementById('search-input').onkeypress = (e) => {
        if(e.key === 'Enter') search(e.target.value);
    };

    loadTrending();
</script>

</body>
</html>
