<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyTube v3.5 - High-Speed Loader</title>
    <style>
        :root { --yt-black: #0f0f0f; --yt-red: #ff0000; --yt-text: #fff; }
        body { background: var(--yt-black); color: var(--yt-text); font-family: sans-serif; margin: 0; }
        
        /* Player UI */
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
        .player-content { max-width: 900px; margin: 20px auto; padding: 10px; }
        .vid-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        
        /* The Iframe Player */
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Loader Overlay */
        #loader-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font-size: 14px; text-align: center; pointer-events: none; }
        .btn-row { margin-top: 15px; display: flex; gap: 10px; }
        .p-btn { background: #222; color: white; border: 1px solid #444; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .p-btn:hover { background: #333; }
    </style>
</head>
<body>

<div id="player-overlay">
    <div class="player-content">
        <button class="p-btn" onclick="closeVideo()">✕ Close</button>
        <div class="vid-box">
            <div id="loader-status">Initializing Piped Stream...</div>
            <iframe id="video-frame" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="btn-row">
            <button class="p-btn" style="background:var(--yt-red); border:none;" onclick="switchPipedInstance()">Video Stuck? Switch Server</button>
            <button class="p-btn" onclick="openOnYoutube()">Open on YouTube (Source)</button>
        </div>
    </div>
</div>

<script>
    // These are Piped instances, which usually handle video streams better than Invidious
    const pipedInstances = [
        "https://pipedapi.kavin.rocks",
        "https://api.piped.victr.me",
        "https://piped-api.lunar.icu",
        "https://pipedapi.leptons.xyz"
    ];

    let currentPipedIdx = 0;
    let activeVideoId = "";

    function playVideo(id) {
        activeVideoId = id;
        document.getElementById('player-overlay').style.display = 'block';
        loadPipedStream();
    }

    function loadPipedStream() {
        const instance = pipedInstances[currentPipedIdx];
        const status = document.getElementById('loader-status');
        const frame = document.getElementById('video-frame');
        
        status.style.display = 'block';
        status.innerText = "Connecting to " + new URL(instance).hostname + "...";
        
        // Piped uses a different embed URL structure that is often cleaner
        // We use the player link from the instance
        const playerUrl = instance.replace('api.', '') + "/embed/" + activeVideoId;
        frame.src = playerUrl;

        // Auto-hide status after 4 seconds (assuming it loaded)
        setTimeout(() => { status.style.display = 'none'; }, 4000);
    }

    function switchPipedInstance() {
        currentPipedIdx = (currentPipedIdx + 1) % pipedInstances.length;
        loadPipedStream();
    }

    function closeVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video-frame').src = "";
    }

    function openOnYoutube() {
        window.open("https://youtube.com/watch?v=" + activeVideoId, "_blank");
    }

    // Connect this to your existing video cards:
    // Example: <div class="video-card" onclick="playVideo('VIDEO_ID_HERE')">
</script>

</body>
</html>
