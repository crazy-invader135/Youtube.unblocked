<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyTube v4.8 - Download Support</title>
    <style>
        :root { --yt-black: #0f0f0f; --yt-red: #ff0000; --yt-text: #fff; --sidebar-w: 240px; }
        body { background: var(--yt-black); color: var(--yt-text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: flex; align-items: center; padding: 10px 20px; background: var(--yt-black); border-bottom: 1px solid #222; height: 56px; flex-shrink: 0; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-w); background: #0f0f0f; border-right: 1px solid #222; padding: 15px; overflow-y: auto; flex-shrink: 0; }
        .nav-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
        .nav-item:hover { background: #272727; }
        #main-view { flex: 1; overflow-y: auto; padding: 20px; }
        #content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { cursor: pointer; transition: transform 0.2s; }
        .thumb { width: 100%; border-radius: 12px; aspect-ratio: 16/9; background: #222; object-fit: cover; }
        .v-title { font-weight: bold; font-size: 14px; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Player & Download UI */
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overflow-y: auto; }
        .player-container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; border-radius: 12px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .btn-red { background: var(--yt-red); }
        .btn-gray { background: #333; }
        .btn-dl { background: #0081ff; }
        #dl-status { font-size: 12px; color: #aaa; margin-top: 8px; }
    </style>
</head>
<body>

<header>
    <div style="font-weight:bold; font-size:20px; cursor:pointer;" onclick="location.reload()">▶ ProxyTube</div>
    <div style="flex:1; display:flex; justify-content:center;">
        <input type="text" id="search-input" placeholder="Search videos...">
    </div>
</header>

<div class="main-layout">
    <div id="sidebar">
        <div class="nav-item" onclick="loadTrending()">🔥 Trending</div>
    </div>
    <div id="main-view">
        <h2 id="view-title">Trending</h2>
        <div id="content-grid"></div>
    </div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <button class="btn btn-gray" onclick="closeVideo()">✕ Close</button>
        <div class="video-wrapper">
            <iframe id="video-frame" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div id="player-meta">
            <h1 id="v-title-display" style="font-size: 22px; margin:15px 0 5px 0;"></h1>
            <p id="v-author-display" style="color: #aaa; margin: 0 0 15px 0;"></p>
            
            <div class="btn-group">
                <button class="btn btn-red" onclick="retryDifferentServer()">Switch Server</button>
                <button class="btn btn-dl" id="dl-btn" onclick="downloadVideo()">⬇ Download Video</button>
            </div>
            <div id="dl-status">Click download to fetch video link...</div>
        </div>
    </div>
</div>

<script>
    const instances = [
        "https://inv.nadeko.net", "https://invidious.f5.si", "https://iv.melmac.space", 
        "https://invidious.nerdvpn.de", "https://yewtu.be", "https://invidious.lunar.icu"
    ];
    let currentIdx = 0;
    let currentId = "";

    async function apiRequest(endpoint) {
        for (let i = 0; i < instances.length; i++) {
            let idx = (currentIdx + i) % instances.length;
            try {
                const res = await fetch(`${instances[idx]}/api/v1/${endpoint}`, { signal: AbortSignal.timeout(3000) });
                if (res.ok) { currentIdx = idx; return await res.json(); }
            } catch (e) {}
        }
        return null;
    }

    async function loadTrending() {
        const data = await apiRequest('trending');
        renderVideos(data);
    }

    function renderVideos(videos) {
        const grid = document.getElementById('content-grid');
        grid.innerHTML = "";
        videos?.forEach(v => {
            const card = document.createElement('div');
            card.className = "video-card";
            card.onclick = () => playVideo(v.videoId, v.title, v.author);
            card.innerHTML = `<img class="thumb" src="${v.videoThumbnails[0].url}"><div class="v-title">${v.title}</div>`;
            grid.appendChild(card);
        });
    }

    function playVideo(id, title, author) {
        currentId = id;
        document.getElementById('player-overlay').style.display = 'block';
        document.getElementById('v-title-display').innerText = title;
        document.getElementById('v-author-display').innerText = author;
        document.getElementById('dl-status').innerText = "Ready to download.";
        updateFrame();
    }

    function updateFrame() {
        document.getElementById('video-frame').src = `${instances[currentIdx]}/embed/${currentId}?autoplay=1&local=true`;
    }

    function retryDifferentServer() {
        currentIdx = (currentIdx + 1) % instances.length;
        updateFrame();
    }

    // --- DOWNLOAD ENGINE ---
    async function downloadVideo() {
        const status = document.getElementById('dl-status');
        status.innerText = "Searching for direct stream link...";
        
        // Fetch full video data from the API
        const data = await apiRequest(`videos/${currentId}`);
        if (data && data.formatStreams && data.formatStreams.length > 0) {
            // Find the best MP4 quality
            const stream = data.formatStreams.find(s => s.container === "mp4") || data.formatStreams[0];
            const dlUrl = stream.url;
            
            status.innerText = "Link found! Starting download...";
            
            // Create a hidden link and click it
            const a = document.createElement('a');
            a.href = dlUrl;
            a.download = `${currentId}.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } else {
            status.innerText = "Error: Could not extract direct link from this server.";
        }
    }

    function closeVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video-frame').src = "";
    }

    document.getElementById('search-input').onkeypress = async (e) => {
        if(e.key === 'Enter') {
            const data = await apiRequest(`search?q=${encodeURIComponent(e.target.value)}`);
            renderVideos(data);
        }
    };

    loadTrending();
</script>
</body>
</html>
