<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Proxy - v2.0</title>
    <style>
        :root { --yt-black: #0f0f0f; --yt-red: #ff0000; --yt-text: #fff; }
        body { background: var(--yt-black); color: var(--yt-text); font-family: sans-serif; margin: 0; overflow-x: hidden; }
        header { display: flex; align-items: center; padding: 10px 20px; background: var(--yt-black); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        #search-input { flex: 1; max-width: 500px; padding: 12px; border-radius: 20px 0 0 20px; border: 1px solid #333; background: #121212; color: white; margin-left: auto; }
        #search-btn { padding: 10px 20px; border-radius: 0 20px 20px 0; border: 1px solid #333; background: #222; color: white; cursor: pointer; margin-right: auto; }
        #content { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .video-card { cursor: pointer; transition: 0.2s; }
        .video-card:hover { transform: translateY(-5px); }
        .thumb { width: 100%; border-radius: 12px; aspect-ratio: 16/9; background: #222; object-fit: cover; }
        .v-title { font-weight: bold; margin-top: 10px; font-size: 14px; line-height: 1.2; height: 2.4em; overflow: hidden; }
        #status { text-align: center; padding: 20px; color: #aaa; }
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 200; flex-direction: column; align-items: center; justify-content: center; }
        iframe { width: 90%; max-width: 1000px; height: 60vh; border: 1px solid #333; border-radius: 12px; }
        .close-btn { margin-bottom: 15px; padding: 10px 25px; background: var(--yt-red); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold;"><span style="color:red">▶</span> ProxyTube</div>
    <input type="text" id="search-input" placeholder="Search YouTube...">
    <button id="search-btn">🔍</button>
</header>

<div id="status">Connecting to YouTube...</div>
<div id="content"></div>

<div id="player-overlay">
    <button class="close-btn" onclick="closeVideo()">CLOSE VIDEO</button>
    <iframe id="video-player" src="" allowfullscreen></iframe>
</div>

<script>
    // Updated 2026 list: Removed unstable servers, added reliable ones
    const instances = [
        "https://inv.nadeko.net",
        "https://invidious.nerdvpn.de",
        "https://iv.melmac.space",
        "https://invidious.no-logs.com"
    ];
    
    let currentInstance = instances[0];

    async function fetchData(endpoint) {
        for (let url of instances) {
            try {
                // local=true is often needed in 2026 to bypass "Content Unavailable"
                const response = await fetch(`${url}/api/v1/${endpoint}`, { signal: AbortSignal.timeout(5000) });
                if (response.ok) {
                    currentInstance = url; 
                    return await response.json();
                }
            } catch (e) {
                console.log(`Failed on ${url}, trying next...`);
            }
        }
        document.getElementById('status').innerText = "All proxy servers are currently busy. Try again in 1 minute.";
        return null;
    }

    async function loadTrending() {
        const videos = await fetchData('trending');
        if (videos) renderVideos(videos);
    }

    async function search() {
        const query = document.getElementById('search-input').value;
        if (!query) return;
        document.getElementById('status').innerText = "Searching...";
        const videos = await fetchData(`search?q=${encodeURIComponent(query)}`);
        if (videos) renderVideos(videos);
    }

    function renderVideos(videos) {
        document.getElementById('status').style.display = 'none';
        const container = document.getElementById('content');
        container.innerHTML = '';
        videos.forEach(v => {
            if (!v.videoId) return;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => playVideo(v.videoId);
            card.innerHTML = `
                <img class="thumb" src="${v.videoThumbnails ? v.videoThumbnails[0].url : ''}" onerror="this.src='https://via.placeholder.com/320x180?text=No+Thumbnail'">
                <div class="v-title">${v.title}</div>
                <div style="color:#aaa; font-size:12px; margin-top:5px;">${v.author}</div>
            `;
            container.appendChild(card);
        });
    }

    function playVideo(id) {
        // Added &local=true to the embed to help bypass Google's blocks
        document.getElementById('video-player').src = `${currentInstance}/embed/${id}?autoplay=1&local=true`;
        document.getElementById('player-overlay').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video-player').src = '';
        document.body.style.overflow = 'auto';
    }

    document.getElementById('search-btn').onclick = search;
    document.getElementById('search-input').onkeypress = (e) => { if(e.key === 'Enter') search(); };
    
    loadTrending();
</script>

</body>
</html>
