<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyTube - Smart Feed</title>
    <style>
        :root { --yt-black: #0f0f0f; --yt-red: #ff0000; --yt-text: #fff; --sidebar-w: 240px; }
        body { background: var(--yt-black); color: var(--yt-text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { display: flex; align-items: center; padding: 10px 20px; background: var(--yt-black); border-bottom: 1px solid #222; height: 56px; flex-shrink: 0; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: var(--sidebar-w); background: #0f0f0f; border-right: 1px solid #222; padding: 15px; overflow-y: auto; flex-shrink: 0; }
        .nav-item { padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-weight: bold; }
        .nav-item:hover { background: #272727; }
        .sub-item { font-size: 14px; padding: 8px; cursor: pointer; color: #aaa; display: flex; justify-content: space-between; }
        .sub-item:hover { color: white; }

        /* Content Area */
        #main-view { flex: 1; overflow-y: auto; padding: 20px; }
        .section-title { font-size: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        #content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .video-card { cursor: pointer; }
        .thumb { width: 100%; border-radius: 12px; aspect-ratio: 16/9; background: #222; object-fit: cover; }
        .v-title { font-weight: bold; font-size: 14px; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Player Overlay */
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; overflow-y: auto; }
        .player-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        #video-frame { width: 100%; aspect-ratio: 16/9; border-radius: 12px; border: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 20px; cursor: pointer;" onclick="loadHome()">▶ ProxyTube</div>
    <div style="flex:1; display:flex; justify-content:center;">
        <input type="text" id="search-input" placeholder="Search" style="width:50%; padding:10px; border-radius:20px; border:1px solid #333; background:#121212; color:white;">
    </div>
</header>

<div class="main-layout">
    <div id="sidebar">
        <div class="nav-item" onclick="loadHome()">🏠 Home</div>
        <div class="nav-item" onclick="loadTrending()">🔥 Trending</div>
        <hr style="border:0; border-top:1px solid #222; margin: 15px 0;">
        <h4 style="margin:0 0 10px 10px; color:#666; font-size:12px; text-transform:uppercase;">Subscriptions</h4>
        <div id="sub-list"></div>
    </div>

    <div id="main-view">
        <div id="section-header" class="section-title">Home</div>
        <div id="content-grid"></div>
    </div>
</div>

<div id="player-overlay">
    <div class="player-container">
        <button style="background:none; border:none; color:white; cursor:pointer; font-size:18px; margin-bottom:10px;" onclick="closeVideo()">✕ Back</button>
        <iframe id="video-frame" allowfullscreen></iframe>
        <h1 id="player-title" style="font-size: 20px; margin: 15px 0;"></h1>
        <div id="player-chan-name" style="font-weight:bold; color:var(--yt-red);"></div>
        <p id="player-desc" style="font-size:14px; color:#aaa; margin-top:15px; line-height:1.5;"></p>
    </div>
</div>

<script>
    const instances = ["https://inv.nadeko.net", "https://invidious.nerdvpn.de", "https://iv.melmac.space"];
    let currentInstance = instances[0];
    
    // Persistent Storage
    let mySubs = JSON.parse(localStorage.getItem('yt-subs')) || [];
    let watchHistory = JSON.parse(localStorage.getItem('yt-history')) || [];

    async function api(path) {
        for (let url of instances) {
            try {
                const res = await fetch(`${url}/api/v1/${path}`, { signal: AbortSignal.timeout(4000) });
                if (res.ok) { currentInstance = url; return await res.json(); }
            } catch (e) {}
        }
        return null;
    }

    // --- Recommendation Logic ---
    async function loadHome() {
        document.getElementById('section-header').innerText = "Recommended for You";
        const grid = document.getElementById('content-grid');
        grid.innerHTML = "Generating your feed...";

        if (watchHistory.length === 0) {
            return loadTrending(); // Default to trending if history is empty
        }

        // Pick 2 random topics from your recent history
        const lastWatched = watchHistory.slice(-3); 
        const randomVideo = lastWatched[Math.floor(Math.random() * lastWatched.length)];
        
        // Use the title of a recently watched video to find "similar" ones
        const topic = randomVideo.title.split(' ').slice(0, 3).join(' ');
        const recommendations = await api(`search?q=${encodeURIComponent(topic)}`);
        
        renderVideos(recommendations);
    }

    async function loadTrending() {
        document.getElementById('section-header').innerText = "Trending Now";
        const data = await api('trending');
        renderVideos(data);
    }

    async function playVideo(id) {
        document.getElementById('player-overlay').style.display = 'block';
        document.getElementById('video-frame').src = `${currentInstance}/embed/${id}?autoplay=1&local=true`;
        
        const vData = await api(`videos/${id}`);
        if (vData) {
            document.getElementById('player-title').innerText = vData.title;
            document.getElementById('player-chan-name').innerText = vData.author;
            document.getElementById('player-desc').innerText = vData.description.substring(0, 500) + "...";

            // Add to History (limit to last 20 videos)
            watchHistory = watchHistory.filter(v => v.id !== id);
            watchHistory.push({id: id, title: vData.title});
            if (watchHistory.length > 20) watchHistory.shift();
            localStorage.setItem('yt-history', JSON.stringify(watchHistory));
        }
    }

    function renderVideos(videos) {
        const grid = document.getElementById('content-grid');
        grid.innerHTML = "";
        videos?.slice(0, 24).forEach(v => {
            grid.innerHTML += `
                <div class="video-card" onclick="playVideo('${v.videoId}')">
                    <img class="thumb" src="${v.videoThumbnails[0].url}">
                    <div class="v-title">${v.title}</div>
                    <div style="color:#aaa; font-size:12px; margin-top:4px;">${v.author}</div>
                </div>`;
        });
    }

    function renderSubList() {
        const list = document.getElementById('sub-list');
        list.innerHTML = "";
        mySubs.forEach(sub => {
            list.innerHTML += `<div class="sub-item" onclick="loadChannel('${sub.id}')">${sub.name}</div>`;
        });
    }

    async function loadChannel(id) {
        document.getElementById('player-overlay').style.display = 'none';
        const data = await api(`channels/${id}`);
        document.getElementById('section-header').innerText = data.author;
        renderVideos(data.latestVideos);
    }

    function closeVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video-frame').src = '';
    }

    document.getElementById('search-input').onkeypress = async (e) => {
        if(e.key === 'Enter') {
            document.getElementById('section-header').innerText = `Search: ${e.target.value}`;
            const data = await api(`search?q=${encodeURIComponent(e.target.value)}`);
            renderVideos(data);
        }
    };

    renderSubList();
    loadHome();
</script>

</body>
</html>
