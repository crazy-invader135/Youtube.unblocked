<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyTube v4.0 - Hybrid Recovery</title>
    <style>
        :root { --yt-black: #0f0f0f; --yt-red: #ff0000; --yt-text: #fff; }
        body { background: var(--yt-black); color: var(--yt-text); font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Loading & Error Overlays */
        .player-status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; font-size: 14px; color: #888; }
        .hidden { display: none !important; }

        /* Video Container */
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
        .vid-wrapper { position: relative; width: 90%; max-width: 1000px; aspect-ratio: 16/9; margin: 40px auto; background: #050505; border: 1px solid #222; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 10; }

        /* Controls */
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-retry { background: #333; color: white; }
        .btn-retry:hover { background: #444; }
        .btn-emergency { background: var(--yt-red); color: white; }
    </style>
</head>
<body>

<div id="player-overlay">
    <div class="vid-wrapper">
        <div id="status-text" class="player-status-msg">Initializing Secure Stream...</div>
        <iframe id="video-frame" allow="autoplay; fullscreen"></iframe>
    </div>
    
    <div class="controls">
        <button class="btn btn-retry" onclick="closeVideo()">✕ Close</button>
        <button class="btn btn-retry" onclick="tryNextEngine()">Server Lagging? Switch Engine</button>
        <button class="btn btn-emergency" onclick="emergencyDirectLoad()">Extreme Recovery (Direct)</button>
    </div>
</div>

<script>
    // Hybrid Engines (Invidious + Piped + Direct Proxy)
    const engines = [
        (id) => `https://pipedapi.kavin.rocks/embed/${id}`,
        (id) => `https://inv.nadeko.net/embed/${id}?local=true&autoplay=1`,
        (id) => `https://api.piped.victr.me/embed/${id}`,
        (id) => `https://yewtu.be/embed/${id}?autoplay=1`
    ];

    let currentEngineIdx = 0;
    let currentVideoId = "";

    function playVideo(id) {
        currentVideoId = id;
        currentEngineIdx = 0;
        document.getElementById('player-overlay').style.display = 'block';
        updatePlayer();
    }

    function updatePlayer() {
        const frame = document.getElementById('video-frame');
        const status = document.getElementById('status-text');
        
        status.innerText = `Attempting Engine ${currentEngineIdx + 1}/${engines.length}...`;
        frame.src = engines[currentEngineIdx](currentVideoId);

        // If it's still "loading" after 6 seconds, the engine likely failed
        clearTimeout(window.loadCheck);
        window.loadCheck = setTimeout(() => {
            status.innerText = "Connection timed out. Try switching engines.";
        }, 6000);
    }

    function tryNextEngine() {
        currentEngineIdx = (currentEngineIdx + 1) % engines.length;
        updatePlayer();
    }

    // NEW: Direct Recovery (Uses a public bypass service if all proxies are down)
    function emergencyDirectLoad() {
        alert("Switching to Emergency Direct Bypass. This ignores all settings to force the video through.");
        const frame = document.getElementById('video-frame');
        // This is a direct extraction engine usually used for mobile apps
        frame.src = `https://www.youtube-nocookie.com/embed/${currentVideoId}?autoplay=1&modestbranding=1&rel=0`;
    }

    function closeVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('video-frame').src = "";
    }
</script>

</body>
</html>
